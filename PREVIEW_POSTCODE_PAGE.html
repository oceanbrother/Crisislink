<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrisisLink - What's your postcode?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(180deg, #fafaf9 0%, #f5f5f4 100%);
            min-height: 100vh;
            padding: 32px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Header */
        header {
            margin-bottom: 32px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 15px;
            margin-bottom: 24px;
            transition: color 0.3s;
            cursor: pointer;
        }

        .back-link:hover {
            color: #6b7280;
        }

        .back-link::before {
            content: '←';
            font-size: 18px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #7ee8c3 0%, #36b886 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
        }

        .tagline {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            background: #7ee8c3;
            border-radius: 50%;
        }

        .stat-text {
            color: #6b7280;
        }

        .stat-text strong {
            color: #1f2937;
            font-weight: 600;
        }

        /* Card */
        .card {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #fde68a;
            border-radius: 20px;
            padding: 40px;
            color: #92400e;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-icon {
            width: 56px;
            height: 56px;
            background: #f59e0b;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .card-description {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #fcd34d;
            background: white;
            border-radius: 12px;
            font-size: 48px;
            font-weight: 600;
            text-align: center;
            color: #d1d5db;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
            color: #1f2937;
        }

        input[type="text"]::placeholder {
            color: #e5e7eb;
        }

        /* Button */
        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #d97706;
            gap: 12px;
        }

        .submit-btn::after {
            content: '→';
            font-size: 20px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            .card-title {
                font-size: 24px;
            }

            .card-description {
                font-size: 15px;
            }

            input[type="text"] {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <a href="#" class="back-link" onclick="alert('Going back...'); return false;">
                Back
            </a>

            <div class="logo-section">
                <div class="logo">🥬</div>
                <div class="logo-text">CrisisLink</div>
            </div>

            <div class="tagline">
                Move surplus food to the people<br>
                who need it most — in seconds
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-dot"></div>
                    <div class="stat-text"><strong>2,841 meals saved</strong> this week</div>
                </div>
                <div class="stat-item">
                    <div class="stat-text"><strong>94 donors</strong> · <strong>31 food banks</strong></div>
                </div>
            </div>
        </header>

        <!-- Main Card -->
        <div class="card">
            <div class="card-icon">📍</div>
            
            <h1 class="card-title">What's your postcode?</h1>
            <p class="card-description">So we can show nearby food banks</p>

            <form class="form-group" onsubmit="handleSubmit(event)">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="postcode" 
                        placeholder="3000"
                        maxlength="4"
                        inputmode="numeric"
                        autocomplete="postal-code"
                    />
                </div>

                <button type="submit" class="submit-btn">
                    Post surplus
                </button>
            </form>
        </div>
    </div>

    <script>
        // Auto-focus input on page load
        document.getElementById('postcode').focus();

        // Only allow numbers
        document.getElementById('postcode').addEventListener('keypress', function(e) {
            if (!/[0-9]/.test(e.key)) {
                e.preventDefault();
            }
        });

        function handleSubmit(e) {
            e.preventDefault();
            const postcode = document.getElementById('postcode').value;
            if (postcode.length === 4) {
                alert(`Postcode ${postcode} submitted! Navigating to donation form...`);
            } else {
                alert('Please enter a valid 4-digit postcode');
            }
        }
    </script>
</body>
</html>
